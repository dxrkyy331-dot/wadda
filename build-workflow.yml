name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build the mod
        run: gradle build
      - name: Keep the jar as a download in the run
        uses: actions/upload-artifact@v4
        with:
          name: target-hud-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Publish the jar under Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
